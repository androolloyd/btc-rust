name: Fuzz smoke tests
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_transaction_decode, fuzz_block_decode, fuzz_script_execute, fuzz_p2p_message, fuzz_bech32_decode, fuzz_varint_decode, fuzz_witness_verify, fuzz_block_template, fuzz_psbt_decode]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo +nightly install cargo-fuzz --locked
      - name: Seed published PSBT vectors
        if: matrix.target == 'fuzz_psbt_decode'
        shell: python
        run: |
          import json, pathlib
          corpus = pathlib.Path("fuzz/corpus/fuzz_psbt_decode")
          corpus.mkdir(parents=True, exist_ok=True)
          for name in ["bip370", "bip371"]:
              source = pathlib.Path(f"crates/primitives/tests/data/{name}.json")
              for i, vector in enumerate(json.loads(source.read_text())["vectors"]):
                  (corpus / f"{name}-{i}").write_bytes(bytes.fromhex(vector["hex"]))
      - run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=30 -rss_limit_mb=2048
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts
