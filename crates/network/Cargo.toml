[package]
name = "btc-network"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["v1", "v2", "erlay", "compact-blocks"]
v1 = []                                     # Standard P2P protocol
v2 = ["dep:chacha20poly1305", "dep:chacha20", "dep:hmac", "dep:secp256k1"] # BIP324
erlay = []                                  # BIP330 set reconciliation
compact-blocks = []                         # BIP152 compact block relay
compact-filters = []                        # BIP157/158 compact block filters serving
package-relay = []                          # Package relay for CPFP-aware relay

[dependencies]
btc-primitives = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
chacha20poly1305 = { workspace = true, optional = true }
chacha20 = { version = "0.9", optional = true }
hmac = { workspace = true, optional = true }
secp256k1 = { workspace = true, optional = true }


[dev-dependencies]
serde_json = { workspace = true }
hex = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
